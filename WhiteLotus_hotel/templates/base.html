<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>White Lotus Hotel</title>
    <!-- Le style est maintenant dans un fichier séparé : static/css/style.css -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a href="/" class="logo">🪷 White Lotus</a>
        <nav>
            <a href="/">Accueil</a>
            <a href="/#chambres">Chambres et suites</a>
            <a href="/#services">Services</a>
            <a href="/reservation" class="btn">Réserver</a>
        </nav>
    </header>

    <div class="main-wrapper">
        <!-- Chaque page vient remplir cet espace -->
        {% block content %}{% endblock %}
    </div>

    <footer>&copy; 2026 White Lotus Hotel. Tous droits réservés.</footer>
</body>
</html>
