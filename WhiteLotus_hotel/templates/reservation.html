{% extends 'base.html' %}

{% block content %}

<div class="formulaire">
    <h2>Réserver un séjour</h2>
    <!-- Le formulaire envoie les données à la route /reservation (routes/reservations.py) -->
    <form action="/reservation" method="POST">
        <div class="champ">
            <label>Nom complet</label>
            <input type="text" name="nom" required placeholder="Ex : Nossaiba EL Aabsi">
        </div>
        <div class="champ">
            <label>Adresse email</label>
            <input type="email" name="email" required placeholder="Ex : elaabsi@exemple.com">
        </div>
        <div class="champ">
            <label>Numéro de la chambre (1, 2 ou 3)</label>
            <input type="number" name="id_chambre" value="1" min="1" required>
        </div>
        <div class="champ">
            <label>Date d'arrivée</label>
            <input type="date" name="date_arrivee" required>
        </div>
        <div class="champ">
            <label>Date de départ</label>
            <input type="date" name="date_depart" required>
        </div>
        <button type="submit" class="btn">Confirmer la réservation</button>
    </form>
</div>

{% endblock %}
